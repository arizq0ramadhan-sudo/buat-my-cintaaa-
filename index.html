<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Masfufah Alifah Tsamrotul Qolbiah</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FFF8E7;font-family:'Quicksand',sans-serif;min-height:100vh}
  .header{background:linear-gradient(135deg,#FF8A4C,#FF5C7A);color:white;padding:30px 20px 40px;text-align:center;border-radius:0 0 30px 30px;box-shadow:0 8px 20px rgba(255,92,122,.3)}
  .header h1{font-family:'Caveat',cursive;font-size:32px;margin:0;line-height:1.2}
  .header p{opacity:.95;margin:10px 0 0;font-size:14px;line-height:1.4}
  .container{max-width:420px;margin:-20px auto 0;padding:20px}
  .card{background:white;padding:18px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.06);margin-bottom:16px;border-left:6px solid #FFB86C}
  .date{font-size:11px;color:#FF8A4C;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
  .isi{font-size:14px;line-height:1.6;color:#444;white-space:pre-wrap}
  .write-box{background:white;padding:20px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.08);border:2px dashed #FFC99A;position:sticky;bottom:20px}
  textarea{width:100%;border:none;background:#FFF8E7;border-radius:12px;padding:14px;box-sizing:border-box;font-family:'Quicksand',sans-serif;font-size:14px;resize:none;outline:none}
  button{background:linear-gradient(135deg,#FF8A4C,#FF5C7A);color:white;border:none;padding:14px;border-radius:30px;width:100%;font-weight:700;font-size:14px;margin-top:12px;cursor:pointer}
  .empty{text-align:center;color:#bbb;padding:40px 20px;font-size:14px}
  .count{text-align:center;font-size:12px;color:#999;margin:10px 0}
  .footer{text-align:center;font-size:11px;color:#ccc;margin:30px 0}
  .sender{font-size:12px;font-weight:700;color:#FF5C7A;margin-bottom:8px}
  .reply-preview{font-size:12px;color:#777;background:#FFF8E7;padding:9px 11px;border-radius:10px;margin:8px 0}
  .reply-btn{width:auto;padding:8px 14px;margin-top:12px;font-size:12px}
  .cancel-reply{background:#eee;color:#555;width:auto;padding:7px 12px;margin:0 0 8px}
  .write-box{z-index:2}
  #sender{width:100%;box-sizing:border-box;border:1px solid #ffe0c7;background:#FFF8E7;border-radius:12px;padding:12px;font:inherit;margin-bottom:10px}
</style>
</head>
<body>
<div class="header">
  <h1>Untuk<br>Masfufah Alifah<br>Tsamrotul Qolbiah 🤍</h1>
  <p>nih sayang..aku buatkan surat digital untuk kitaa biar lucu sayang<br>selama hp kamu lagi di rampas</p>
</div>
<div class="container">
  <div class="count" id="count"></div>
  <div id="list"><div style="text-align:center;padding:20px;color:#FF8A4C">lagi ngambil surat edee... 🤍</div></div>
  <div class="write-box">
    <div style="font-weight:700;margin-bottom:8px">✍️ Tulis surat atau balasan</div>
    <input id="sender" maxlength="40" placeholder="🤍aa atoo edee🤍" />
    <div id="replying"></div>
    <textarea id="input" rows="4" placeholder="Tulis cerita atau balasan kamu di sini yaa 🤍"></textarea>
    <button id="btn" onclick="tambah()">tap ini kalo kamu mau kirim Surat buat edee 💌</button>
    <div style="font-size:11px;color:#999;text-align:center;margin-top:8px">nanti bakal otomatis ke simpen sayangg</div>
  </div>
  <div class="footer">dibuat dengan cintaa • untuk edee 🥰😘</div>
</div>
<script>
const API = "https://api.npoint.io/13ac18bcf38f87367bfa";
let data = [];
let replyTo = null;

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

async function load() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error('Gagal memuat surat');
    const result = await r.json();
    data = Array.isArray(result) ? result : [];
    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      '<div class="empty">Surat belum bisa dimuat. Coba refresh dan cek internet ya 🤍</div>';
  }
}

function render() {
  const list = document.getElementById('list');
  document.getElementById('count').innerText =
    data.length ? `sudah ada ${data.length} surat untuk edee sayang` : '';
  if (!data.length) {
    list.innerHTML = '<div class="empty">Belum ada cerita...<br>Tulis yang pertama yuk! 👇</div>';
    return;
  }

  const ordered = data.slice().reverse();
  list.innerHTML = ordered.map(d => {
    const reply = d.replyTo ? data.find(x => String(x.id) === String(d.replyTo)) : null;
    const replyPreview = reply
      ? `<div class="reply-preview">↪ Membalas <b>${escapeHTML(reply.pengirim || 'Anonim')}</b>: ${escapeHTML((reply.isi || '').slice(0, 120))}</div>`
      : (d.replyTo ? '<div class="reply-preview">↪ Membalas surat sebelumnya</div>' : '');
    return `<div class="card" id="msg-${escapeHTML(d.id || '')}">
      <div class="date">📅 ${escapeHTML(d.tanggal || '')} • ${escapeHTML(d.jam || '')}</div>
      <div class="sender">💌 ${escapeHTML(d.pengirim || 'Anonim')}</div>
      ${replyPreview}
      <div class="isi">${escapeHTML(d.isi || '')}</div>
      <button class="reply-btn" onclick="balas('${escapeHTML(d.id || '')}')">↩️ Balas surat ini</button>
    </div>`;
  }).join('');
}

function balas(id) {
  const target = data.find(d => String(d.id) === String(id));
  if (!target) return;
  replyTo = target.id;
  document.getElementById('replying').innerHTML =
    `<div class="reply-preview">Membalas <b>${escapeHTML(target.pengirim || 'Anonim')}</b>: ${escapeHTML((target.isi || '').slice(0, 100))}
    <br><button class="cancel-reply" onclick="batalBalas()">Batal membalas ✕</button></div>`;
  document.getElementById('input').focus();
  document.querySelector('.write-box').scrollIntoView({behavior:'smooth', block:'center'});
}

function batalBalas() {
  replyTo = null;
  document.getElementById('replying').innerHTML = '';
}

async function tambah() {
  const isi = document.getElementById('input').value.trim();
  const pengirim = document.getElementById('sender').value.trim() || 'Anonim';
  if (!isi) return alert('Tulis ceritanya dulu yaa 🤍');

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.innerText = 'lagi ngirim... 💌';
  const now = new Date();
  const item = {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
    pengirim,
    tanggal: now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'}),
    jam: now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}),
    isi,
    replyTo
  };

  try {
    // Ambil data terbaru dulu supaya pesan dari kedua perangkat tidak mudah tertimpa.
    const latest = await fetch(API);
    if (!latest.ok) throw new Error('Tidak bisa mengambil data terbaru');
    const current = await latest.json();
    data = Array.isArray(current) ? current : [];
    data.push(item);

    const saved = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if (!saved.ok) throw new Error('Gagal menyimpan surat');

    document.getElementById('input').value = '';
    replyTo = null;
    document.getElementById('replying').innerHTML = '';
    render();
  } catch (e) {
    alert('Surat belum berhasil dikirim. Coba lagi yaa, jangan tutup halaman dulu 🤍');
    await load();
  } finally {
    btn.disabled = false;
    btn.innerText = 'tap ini kalo kamu mau kirim Surat 💌';
  }
}

load();
</script>
</body>
</html>
